d a rod like this for snap jigging the deeper Long Island Sound rips for stripers and sea bass, as well as for blackfishing in environments where light tackle jigging isn’t practical due to deep and fast-moving water. The final version of the rod was tested bucktailing and live-lining 10-50 lb Goliath Grouper in Florida, where it proved it will handle any striper or blackfish that comes its way.\"\nDark Matter John Skinner Jig and Bounce Spinning Rods come with a 1-year limited warranty. They are a beautiful blue color with Carolina blue in the guide wraps. Choose from two terrific models! If you're fishing in saltwater, this is the rod to get.\nModels: DMSJB62MLS, DMSJB63MS\n \n",

ng and bottom fishing. Some anglers prefer spinning gear for fluke jigging, especially when fishing the up-drift side of a party boat. This is an excellent fluke jigging rod because it was built using the lessons learned while developing the Jig and Bounce casting version. Grip material is an often-overlooked detail on a rod, but this uses the same high quality anti-slip components as the casting version. The grips are a product of the golf club industry, but they excel at preventing slippage caused by fish slime and Gulp juice. \u003c\/span\u003e\u003cspan\u003eI especially wanted a rod like this for snap jigging the deeper Long Island Sound rips for stripers and sea bass, as well as for blackfishing in environments where light tackle jigging isn’t practical due to deep and fast-moving water. The final version of the rod was tested bucktailing and live-lining 10-50 lb Goliath Grouper in Florida, where it proved it will handle any striper or blackfish that comes its way.\"\u003c\/span\u003e\u003c\/span\u003e\u003c\/span\u003e\u003c\/p\u003e\n\u003cp\u003e\u003cspan style=\"font-family: arial, helvetica, sans-serif; font-size: medium;\"\u003e\u003cspan\u003eDark Matter John Skinner Jig and Bounce Spinning Rods\u003c\/span\u003e come with a \u003ca href=\"\/sloopster_warranty\" title=\"Sloopster Warranty\"\u003e1-year limited warranty\u003c\/a\u003e. They are a beautiful blue color with Carolina blue in the guide wraps. Choose from two terrific models! If you're fishing in saltwater, this is the rod to get.\u003c\/span\u003e\u003c\/p\u003e\n\u003cp\u003e\u003cspan style=\"font-family: arial, helvetica, sans-serif; font-size: medium;\"\u003eModels: \u003cspan\u003eDMSJB62MLS, DMSJB63MS\u003c\/span\u003e\u003c\/span\u003e\u003c\/p\u003e\n\u003cp\u003e \u003c\/p\u003e\n\u003c\/div\u003e"}
