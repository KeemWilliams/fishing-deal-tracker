# Retailer policy config (architecture doc 3.3). min_delay_s / caps are
# conservative defaults per the politeness rule (7.2) -- 8-10s floor plus
# jitter, no stealth, no proxy.
#
# Academy and J&H Tackle adapters were committed in an earlier task but
# this file never carried an entry for them, so `fpt tick` never actually
# ran either adapter even though db seed 012 and the adapter registry (as
# of 2026-09-12) both otherwise expect them enabled -- found and fixed
# while adding fishusa/tackledirect/alltackle below. Both use the exact
# same conservative policy/breaker shape as tackle_warehouse rather than
# the (unused-until-now) rates originally recorded in db seed 012, per
# explicit instruction to keep new/newly-enabled retailers conservative.
#
# `allowed_hosts` (security review M3, added 2026-09-13): the ONLY
# hostnames fpt/fetch/url_safety.py will ever let a request or a
# post-redirect final_url resolve against for this retailer. Every URL
# this codebase turns into an outbound request -- a configured discovery/
# product page, a retailer-supplied `next_page_url`, or an enrolled
# `DiscoveredItem.product_url` -- is checked against this list before the
# request is made, and again on the response's `final_url` after
# redirects. Kept deliberately narrow (the bare apex plus the one `www.`
# host actually used in `base_url`/fixtures) rather than a wildcard.
#
# `stealth_approved` (security review M2, added 2026-09-13): default
# false for every retailer. `fpt tick --use-stealth` on the CLI is
# necessary but NEVER sufficient by itself -- fpt/cli.py ANDs the CLI flag
# with this per-retailer flag before ever constructing a stealth-capable
# HttpFetcher (see fpt/fetch/http_fetcher.py's class docstring). No
# retailer has owner approval for stealth today (architecture doc 7.3/A4).
retailers:
  - slug: tackle_warehouse
    name: "Tackle Warehouse"
    base_url: "https://www.tacklewarehouse.com"
    adapter_slug: tackle_warehouse
    enabled: true
    allowed_hosts: [www.tacklewarehouse.com]
    stealth_approved: false
    policy: &conservative_policy
      min_delay_s: 10
      jitter_s: 5
      max_requests_per_hour: 90
      max_requests_per_day: 1200
      reserved_share: {CONFIRM: 0.15, HOT: 0.15}
      quiet_hours_utc: null
      timeout_s: 30
      retry_on: [500, 502, 503, 504, "timeout"]
      max_retries: 1
      retry_backoff_s: 120
      breaker:
        consecutive_blocks: 5
        block_rate_threshold: 0.20
        block_rate_min_sample: 20
        cooldown_hours: 12
        disable_after_trips_in_48h: 2
    egress: {mode: DIRECT, proxy_url_env: null, api_key_env: null}
    user_agent_profile: identified
    tracked_url_cap: 2500

  - slug: academy
    name: "Academy Sports + Outdoors"
    base_url: "https://www.academy.com"
    adapter_slug: academy
    enabled: true
    allowed_hosts: [www.academy.com]
    stealth_approved: false
    policy: *conservative_policy
    egress: {mode: DIRECT, proxy_url_env: null, api_key_env: null}
    user_agent_profile: identified
    tracked_url_cap: 2500

  - slug: jandh
    name: "J&H Tackle"
    base_url: "https://www.jandh.com"
    adapter_slug: jandh
